[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony"
version = "0.1.0"
description = "RL dispatcher for assigning ground tasks across a satellite constellation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "torch>=2.1",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
basilisk = ["bsk"]

[tool.setuptools]
packages = ["sim", "sim.ops", "agent", "agent.env", "agent.policy"]

[tool.pytest.ini_options]
testpaths = ["sim/tests", "agent/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]
